# Omarchy-style lock screen, Tokyo Night colors.
general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/.local/share/wallpapers/1-quattro.jpg
    blur_passes = 2
    color = rgba(1a1b26ff)
}

input-field {
    monitor =
    size = 600, 90
    position = 0, 0
    halign = center
    valign = center
    inner_color = rgba(1a1b26cc)
    outer_color = rgba(7aa2f7ff)
    outline_thickness = 4
    font_family = JetBrainsMono Nerd Font
    font_color = rgba(a9b1d6ff)
    placeholder_text = Enter Password
    check_color = rgba(9ece6aff)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}
