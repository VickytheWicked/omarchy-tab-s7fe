# Touch-only tablet: no automatic lock (the on-screen keyboard cannot type into
# hyprlock). After 15 minutes the backlight goes to 0 (no DPMS: switching the
# panel off/on can leave it black, see tablet-display-toggle); a touch restores it.
# Every backlight change is a DCS command on the DSI link and can glitch the
# picture (dsi_err_worker status=5), so the timeout is kept long.
# Skipped while the power button has the screen off: saving would overwrite the
# brightness tablet-display-toggle restores, and resuming would light the
# screen with touch still blocked.
listener {
    timeout = 900
    on-timeout = [ -e "$XDG_RUNTIME_DIR/tablet-display-off" ] || brightnessctl -c backlight -q -s set 0
    on-resume = [ -e "$XDG_RUNTIME_DIR/tablet-display-off" ] || brightnessctl -c backlight -q -r
}
