# Touch-only tablet: no automatic lock (the on-screen keyboard cannot type into
# hyprlock). After 5 minutes the backlight goes to 0 (no DPMS: switching the
# panel off/on can leave it black, see tablet-display-toggle); a touch restores it.
listener {
    timeout = 300
    on-timeout = brightnessctl -c backlight -q -s set 0
    on-resume = brightnessctl -c backlight -q -r
}
