# Omarchy-style Hyprland for the Galaxy Tab S7 FE (Hyprland 0.54, hyprlang syntax).
# Translated from /usr/share/omarchy/default/hypr/*.lua on the laptop, Tokyo Night colors.

# ── Screen ────────────────────────────────────────────────────────────────
# Panel is 1600x2560 portrait; transform 3 turns it to landscape the right way up.
# If the picture is upside down, use transform 1 here AND in touchdevice below.
monitor = DSI-1, preferred, auto, 1.6, transform, 3

# ── Programs ──────────────────────────────────────────────────────────────
$terminal = alacritty
$menu = fuzzel

# ── Environment ───────────────────────────────────────────────────────────
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
# Claude Code on Alpine (musl): use the system ripgrep
env = USE_BUILTIN_RIPGREP,0

# ── Autostart ─────────────────────────────────────────────────────────────
# PipeWire first: Waybar's volume module blocks without an audio server.
exec-once = /usr/libexec/pipewire-launcher
exec-once = waybar
exec-once = mako
exec-once = swaybg -i ~/.local/share/wallpapers/current -m fill
exec-once = hypridle
exec-once = wvkbd-mobintl --hidden -L 300
exec-once = dbus-update-activation-environment --all
exec-once = tablet-bt-reconnect

# ── Input ─────────────────────────────────────────────────────────────────
input {
    kb_layout = us
    repeat_rate = 40
    repeat_delay = 600
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }

    touchdevice {
        transform = 3
        output = DSI-1
    }
}

# ── Look and feel (Omarchy looknfeel.lua) ─────────────────────────────────
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgb(7aa2f7)
    col.inactive_border = rgba(595959aa)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 0
    shadow {
        enabled = false
    }
    blur {
        enabled = false
    }
}

group {
    col.border_active = rgb(7aa2f7)
    col.border_inactive = rgba(595959aa)
    groupbar {
        font_size = 12
        font_family = monospace
        indicator_height = 1
        height = 22
        gaps_in = 5
        gaps_out = 0
        text_color = rgb(ffffff)
        col.active = rgba(00000040)
        col.inactive = rgba(00000020)
        gradients = true
    }
}

animations {
    enabled = true

    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1.0
    bezier = quick, 0.15, 0, 0.1, 1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 3.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = fadeSwitch, 0
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 0
    animation = specialWorkspace, 1, 3, easeOutQuint, slidevert
}

dwindle {
    preserve_split = true
    force_split = 2
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
    # hyprland-guiutils is not packaged for Alpine; skip the startup warning
    disable_hyprland_guiutils_check = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

cursor {
    hide_on_touch = true
    # The DPU hardware cursor plane is misplaced/clipped on the rotated panel;
    # draw the pointer in software so a mouse can reach the whole screen.
    no_hardware_cursors = true
}

# ── Applications (Omarchy bindings/applications.lua) ──────────────────────
bind = SUPER, RETURN, exec, $terminal
bind = SUPER ALT, RETURN, exec, foot
bind = SUPER SHIFT, RETURN, exec, chromium
bind = SUPER SHIFT, B, exec, chromium
bind = SUPER SHIFT ALT, B, exec, chromium --incognito
bind = SUPER SHIFT, N, exec, codium
bind = SUPER, SPACE, exec, tablet-menu
bind = SUPER ALT, SPACE, exec, tablet-menu apps
bind = SUPER, ESCAPE, exec, tablet-menu system
# Power button only turns the display (and touch) off/on; System menu: Super+Escape or the bar
bindl = , XF86PowerOff, exec, tablet-display-toggle
bind = SUPER, K, exec, tablet-keybindings
bind = SUPER CTRL, K, exec, tablet-osk-toggle
bind = SUPER SHIFT, SPACE, exec, pkill -SIGUSR1 waybar

# ── Tiling (Omarchy bindings/tiling.lua) ──────────────────────────────────
bind = SUPER, W, killactive
bind = SUPER, J, layoutmsg, togglesplit
bind = SUPER, P, pseudo
bind = SUPER, T, togglefloating
bind = SUPER, F, fullscreen, 0
bind = SUPER ALT, F, fullscreen, 1

bind = SUPER, LEFT, movefocus, l
bind = SUPER, RIGHT, movefocus, r
bind = SUPER, UP, movefocus, u
bind = SUPER, DOWN, movefocus, d

bind = SUPER, code:10, workspace, 1
bind = SUPER, code:11, workspace, 2
bind = SUPER, code:12, workspace, 3
bind = SUPER, code:13, workspace, 4
bind = SUPER, code:14, workspace, 5
bind = SUPER, code:15, workspace, 6
bind = SUPER, code:16, workspace, 7
bind = SUPER, code:17, workspace, 8
bind = SUPER, code:18, workspace, 9
bind = SUPER, code:19, workspace, 10

bind = SUPER SHIFT, code:10, movetoworkspace, 1
bind = SUPER SHIFT, code:11, movetoworkspace, 2
bind = SUPER SHIFT, code:12, movetoworkspace, 3
bind = SUPER SHIFT, code:13, movetoworkspace, 4
bind = SUPER SHIFT, code:14, movetoworkspace, 5
bind = SUPER SHIFT, code:15, movetoworkspace, 6
bind = SUPER SHIFT, code:16, movetoworkspace, 7
bind = SUPER SHIFT, code:17, movetoworkspace, 8
bind = SUPER SHIFT, code:18, movetoworkspace, 9
bind = SUPER SHIFT, code:19, movetoworkspace, 10

bind = SUPER SHIFT ALT, code:10, movetoworkspacesilent, 1
bind = SUPER SHIFT ALT, code:11, movetoworkspacesilent, 2
bind = SUPER SHIFT ALT, code:12, movetoworkspacesilent, 3
bind = SUPER SHIFT ALT, code:13, movetoworkspacesilent, 4
bind = SUPER SHIFT ALT, code:14, movetoworkspacesilent, 5
bind = SUPER SHIFT ALT, code:15, movetoworkspacesilent, 6
bind = SUPER SHIFT ALT, code:16, movetoworkspacesilent, 7
bind = SUPER SHIFT ALT, code:17, movetoworkspacesilent, 8
bind = SUPER SHIFT ALT, code:18, movetoworkspacesilent, 9
bind = SUPER SHIFT ALT, code:19, movetoworkspacesilent, 10

bind = SUPER, S, togglespecialworkspace, scratchpad
bind = SUPER ALT, S, movetoworkspacesilent, special:scratchpad

bind = SUPER, TAB, workspace, e+1
bind = SUPER SHIFT, TAB, workspace, e-1
bind = SUPER CTRL, TAB, workspace, previous

bind = SUPER SHIFT, LEFT, swapwindow, l
bind = SUPER SHIFT, RIGHT, swapwindow, r
bind = SUPER SHIFT, UP, swapwindow, u
bind = SUPER SHIFT, DOWN, swapwindow, d

bind = ALT, TAB, cyclenext
bind = ALT, TAB, bringactivetotop
bind = ALT SHIFT, TAB, cyclenext, prev
bind = ALT SHIFT, TAB, bringactivetotop

# code:20 is minus, code:21 is equal
bind = SUPER, code:20, resizeactive, -100 0
bind = SUPER, code:21, resizeactive, 100 0
bind = SUPER SHIFT, code:20, resizeactive, 0 -100
bind = SUPER SHIFT, code:21, resizeactive, 0 100
bind = SUPER ALT, code:20, resizeactive, -25 0
bind = SUPER ALT, code:21, resizeactive, 25 0
bind = SUPER CTRL, code:20, resizeactive, -300 0
bind = SUPER CTRL, code:21, resizeactive, 300 0

bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

bind = SUPER, G, togglegroup
bind = SUPER ALT, G, moveoutofgroup
bind = SUPER ALT, LEFT, moveintogroup, l
bind = SUPER ALT, RIGHT, moveintogroup, r
bind = SUPER ALT, UP, moveintogroup, u
bind = SUPER ALT, DOWN, moveintogroup, d
bind = SUPER ALT, TAB, changegroupactive, f
bind = SUPER ALT SHIFT, TAB, changegroupactive, b

# ── Utilities (Omarchy bindings/utilities.lua, tablet subset) ─────────────
bind = SUPER, comma, exec, makoctl dismiss
bind = SUPER SHIFT, comma, exec, makoctl dismiss --all
bind = SUPER CTRL, N, exec, tablet-nightlight-toggle
bind = SUPER CTRL, B, exec, alacritty -e bluetui
bind = SUPER CTRL, U, exec, tablet-usb-mode toggle
bind = , PRINT, exec, tablet-screenshot region
bind = SHIFT, PRINT, exec, tablet-screenshot full

# ── Omarchy menu shortcuts (bindings/utilities.lua) ───────────────────────
bind = SUPER CTRL, C, exec, tablet-menu trigger.capture
bind = SUPER CTRL, O, exec, tablet-menu trigger.toggle
bind = SUPER CTRL, H, exec, tablet-menu trigger.hardware
bind = SUPER CTRL, SPACE, exec, tablet-menu style.background
bind = SUPER SHIFT CTRL, SPACE, exec, tablet-menu style.theme
bind = SUPER CTRL, I, exec, tablet-toggle idle
bind = SUPER CTRL, comma, exec, tablet-toggle notifications
bind = SUPER SHIFT, BACKSPACE, exec, tablet-toggle gaps
bind = SUPER, PRINT, exec, pkill hyprpicker || hyprpicker -a

# ── Media and brightness (Omarchy bindings/media.lua) ─────────────────────
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
