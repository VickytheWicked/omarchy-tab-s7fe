# Launcher styled like Omarchy's walker, Tokyo Night colors.
[main]
font=JetBrainsMono Nerd Font:size=15
prompt="󰍉  "
terminal=alacritty -e
width=40
lines=10
horizontal-pad=20
vertical-pad=14
inner-pad=12
# 44 px rows: about 7.5 mm at scale 1.6, a comfortable finger target
line-height=44
layer=overlay

[colors]
background=1a1b26ff
text=a9b1d6ff
prompt=7aa2f7ff
input=c0caf5ff
match=7aa2f7ff
selection=292e42ff
selection-text=c0caf5ff
selection-match=7aa2f7ff
border=7aa2f7ff

[border]
width=2
radius=0
