# Default settings for chromium. This file is sourced by /bin/sh from
# the chromium launcher.
# Flags adapted from Omarchy's config/chromium-flags.conf: Wayland, swipe
# navigation, touch. No GNOME keyring here, so the basic password store.
# Wayland IME (text-input-v3) so squeekboard pops up in text fields.
CHROMIUM_FLAGS="--ozone-platform=wayland --ozone-platform-hint=wayland --enable-features=TouchpadOverscrollHistoryNavigation --touch-events=enabled --password-store=basic --enable-wayland-ime --wayland-text-input-version=3"
